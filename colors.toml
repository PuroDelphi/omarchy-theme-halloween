# Halloween — noche de calabazas, amatista y luz de vela.
# Semantic palette for Omarchy; app configs are generated by Omarchy itself.
mode = "dark"

# Focus and selection. Orange identifies actions, never errors.
accent = "#FF9A3C"
selection = "#4B2E53"
selection_background = "#4B2E53"
selection_foreground = "#FFF4DF"
muted = "#9B8DA8"

# Surfaces: void, night, panel and elevated plum.
background = "#121016"
dark_background = "#0D0B11"
darker_background = "#08070C"
lighter_background = "#251D2D"

# Text: warm parchment, secondary lavender, pale bone and candle ivory.
foreground = "#F5E9D3"
dark_foreground = "#B6A6C1"
light_foreground = "#D8C9E3"
bright_foreground = "#FFF4DF"

# Semantic accents / ANSI base colors.
red = "#FF667A"
green = "#B5D66F"
yellow = "#FFD166"
blue = "#A5B4FC"
purple = "#BB9AF7"
magenta = "#ED96C3"
cyan = "#7ED6C4"
orange = "#FF9A3C"
brown = "#B88565"

# Bright terminal colors; intentionally distinct from the base palette.
bright_red = "#FF8A99"
bright_green = "#CAE894"
bright_yellow = "#FFE29A"
bright_blue = "#C1CBFF"
bright_purple = "#D2B8FF"
bright_magenta = "#FFB5DC"
bright_cyan = "#A5EADC"

# Shared border gradient: pumpkin to amethyst, no compositor code shipped.
hyprland_active_border = "#FF9A3C #BB9AF7 45deg"
hyprland_inactive_border = "#4B3A55"
